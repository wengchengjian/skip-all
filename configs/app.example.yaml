# skip-all 应用配置示例
schema_version: 1
language: zh-CN
log_level: info
capture:
  method: auto # auto / printwindow / bitblt（PrintWindow 可后台截图）
  target_fps: 5
input:
  mode: background # background：PostMessage，不抢焦点；foreground：SendInput
  cursor_mode: auto # auto：不切前台，移光标+窗口消息；never：纯消息不移动光标；always：同 auto
  pause_when_background: false # 后台模式下保持运行；需要前台才暂停时改为 true
  gamepad: false # 需要虚拟手柄时改为 true（需 ViGEmBus 驱动 + ViGEmClient.dll）
hotkeys:
  toggle: F9
  panic: F10
ocr:
  model: ppocrv6
  auto_download: true
  model_dir: "" # 留空使用默认模型目录
  gpu: auto # auto：DirectML → CUDA → CPU；也可设 dml / cuda / cpu
  runtime_dir: "" # 放置 onnxruntime_dml.dll / onnxruntime_cuda.dll 的目录；留空自动查 runtime 目录
excluded_games: [] # 启动时排除的游戏 ID，例如 [zzz]；留空表示全部启用
